  <text x="550" y="56" text-anchor="middle" fill="#082F49" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Let's Build Together</text>
  <text x="550" y="132" text-anchor="middle" fill="#082F49" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">I build AI systems and come from Japan.</text>
  <text x="550" y="172" text-anchor="middle" fill="#082F49" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">If you like shipping, a shared setup could be</text>
