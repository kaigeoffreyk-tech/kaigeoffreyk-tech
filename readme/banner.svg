  <text x="550" y="252" text-anchor="middle" fill="#082F49" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">I can put nearly $3,000 / month toward a</text>
  <text x="550" y="292" text-anchor="middle" fill="#082F49" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">partner who actually shows up.</text>
  <text x="550" y="358" text-anchor="middle" fill="#A5F3FC" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Building AI products full time</text>
  <text x="550" y="404" text-anchor="middle" fill="#A5F3FC" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Let's build together for real</text>
  <text x="550" y="450" text-anchor="middle" fill="#A5F3FC" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Nearly $3,000/month to share</text>
